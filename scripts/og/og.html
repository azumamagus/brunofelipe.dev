<!doctype html>
<html><head><meta charset="utf-8"><style>
/* Social share card 1200x630. Render: see scripts/og/README in package notes (Chrome headless screenshot). */
:root{--bg:#080906;--surface:#10120c;--line:#2b3020;--line-bright:#555e2d;--text:#f2f3ed;--muted:#b4b7aa;--lime:#dff000}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;background:var(--bg);overflow:hidden}
body{position:relative;font-family:Inter,'Segoe UI',Arial,sans-serif;color:var(--text)}
.bg{position:absolute;inset:0;
 background:
  linear-gradient(rgba(223,240,0,.05) 1px,transparent 1px),
  linear-gradient(90deg,rgba(223,240,0,.05) 1px,transparent 1px);
 background-size:42px 42px;
 -webkit-mask-image:radial-gradient(ellipse 90% 90% at 70% 40%,#000 10%,transparent 100%)}
.art{position:absolute;right:-120px;top:0;width:760px;height:630px;opacity:.38;
 background:url(../../public/images/hero-workspace.png) center/cover;
 -webkit-mask-image:linear-gradient(90deg,transparent,#000 55%)}
.glow{position:absolute;right:-80px;top:-120px;width:620px;height:620px;border-radius:50%;background:var(--lime);filter:blur(170px);opacity:.12}
.wrap{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;justify-content:space-between}
.tag{font:600 20px/1 'Cascadia Code',Consolas,monospace;letter-spacing:.14em;color:var(--lime);text-transform:uppercase;border-left:3px solid var(--lime);padding-left:14px}
.domain{font:500 22px/1 'Cascadia Code',Consolas,monospace;color:var(--muted)}
.main{display:flex;align-items:center;gap:56px}
.photo{flex:none;width:250px;height:250px;border-radius:50%;border:3px solid var(--line-bright);box-shadow:0 0 0 12px rgba(223,240,0,.05),0 30px 70px rgba(0,0,0,.6);overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
h1{font-size:94px;line-height:.92;font-weight:800;letter-spacing:-.045em;text-transform:uppercase}
h1 span{color:var(--lime)}
.name{margin-top:26px;font-size:38px;font-weight:600;letter-spacing:-.01em}
.role{margin-top:8px;font-size:26px;color:var(--muted)}
.chips{display:flex;gap:12px}
.chips span{font:600 20px/1 'Cascadia Code',Consolas,monospace;padding:12px 18px;border:1px solid var(--line-bright);border-radius:10px;background:rgba(16,18,12,.85);color:var(--text)}
.chips span.hl{color:var(--lime);border-color:rgba(223,240,0,.45)}
</style></head><body>
<div class="bg"></div><div class="glow"></div><div class="art"></div>
<div class="wrap">
 <div class="top"><div class="tag">Software Developer</div><div class="domain">brunofelipe.dev</div></div>
 <div class="main">
  <div class="photo"><img src="../../public/images/bruno.jpg" alt=""></div>
  <div>
   <h1>Build.<br>Secure.<br><span>Deliver.</span></h1>
  </div>
 </div>
 <div>
  <div class="name" style="margin:0 0 6px">Bruno Da Cunha Felipe</div>
  <div class="role" style="margin:0 0 24px">.NET and PHP developer · Cybersecurity enthusiast</div>
  <div class="chips"><span>.NET</span><span>PHP</span><span>Laravel</span><span>APIs</span><span class="hl">Security</span></div>
 </div>
</div>
</body></html>
